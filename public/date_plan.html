<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan Your Date</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/date-plan.css">
</head>
<body>
    <div class="plan-container">
        <h2>Yayyyyyyy!! Now let's plan our date.</h2>
        <form id="date-plan-form">
            <div class="form-group">
                <label for="date">Which day works best? (Date)</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="time">What time?</label>
                <input type="time" id="time" required>
            </div>
            <div class="form-group">
                <label for="place">Where should we go? (Place)</label>
                <select id="place" required>
                    <option value="Coffee Shop">Coffee Shop</option>
                    <option value="Restaurant">Restaurant</option>
                    <option value="Cinema">Cinema</option>
                    <option value="Park">Park</option>
                    <option value="Somewhere else">Somewhere else</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="Enter location" required>
            </div>
            <div class="form-group">
                <label for="notes">Notes (Anything you'd like to tell me?)</label>
                <textarea id="notes" rows="4"></textarea>
            </div>
            <button type="submit" class="submit-button">Confirm</button>
        </form>
    </div>

    <script>

        const params = new URLSearchParams(window.location.search);
        const responseId = params.get("id");

        if (!responseId) {
            alert("Response ID is missing.");
        }

        document
            .getElementById("date-plan-form")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const date =
                    document.getElementById("date").value;

                const time =
                    document.getElementById("time").value;

                const place =
                    document.getElementById("place").value;

                const location =
                    document.getElementById("location").value;

                const notes =
                    document.getElementById("notes").value;

                try {

                    const response = await fetch(
                        `/api/responses/${responseId}/date`,
                        {
                            method: "PATCH",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                date,
                                time,
                                place,
                                location,
                                notes
                            })
                        }
                    );

                    const result = await response.json();

                    if (!result.success) {
                        throw new Error(result.message);
                    }

                    window.location.href =
                        `final_page.html?id=${responseId}`;

                } catch (error) {

                    console.error(
                        "Failed to save date plan:",
                        error
                    );

                    alert(
                        "Something went wrong while saving your date plan."
                    );

                }

            });

    </script>
</body>
</html>
