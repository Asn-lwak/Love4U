<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Official Date!</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/final.css">

    <script>

        document.addEventListener("DOMContentLoaded", async () => {

            const params =
                new URLSearchParams(window.location.search);

            const responseId =
                params.get("id");

            const dateMessage =
                document.getElementById("date-message");

            if (!responseId) {

                dateMessage.textContent =
                    "Your date details couldn't be found. 💔";

                return;
            }

            try {

                const response = await fetch(
                    `/api/responses/${responseId}`
                );

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message);
                }

                const plan = result.response;

                const dateObj =
                    new Date(`${plan.date}T00:00:00`);

                const formattedDate =
                    dateObj.toLocaleDateString(
                        undefined,
                        {
                            weekday: "long",
                            year: "numeric",
                            month: "long",
                            day: "numeric"
                        }
                    );

                const [hours, minutes] =
                    plan.time.split(":");

                const timeObj =
                    new Date();

                timeObj.setHours(
                    Number(hours),
                    Number(minutes)
                );

                const formattedTime =
                    timeObj.toLocaleTimeString(
                        undefined,
                        {
                            hour: "numeric",
                            minute: "2-digit"
                        }
                    );

                dateMessage.innerHTML = `
                    <strong>${formattedDate}</strong><br>
                    ${formattedTime}<br>
                    <span>${plan.place}</span><br>
                    <small>${plan.location}</small>
                `;

            } catch (error) {

                console.error(
                    "Failed to load date plan:",
                    error
                );

                dateMessage.textContent =
                    "Something went wrong loading your date. 💔";
            }

            createHearts();
            createSparkles();
            
        });


        function createHearts() {

            for (let i = 0; i < 20; i++) {

                const heart =
                    document.createElement("div");

                heart.classList.add("heart");

                heart.textContent = "♥";

                heart.style.left =
                    `${Math.random() * 100}vw`;

                heart.style.animationDelay =
                    `${Math.random() * 6}s`;

                document.body.appendChild(heart);
            }
        }

        function createSparkles() {

            const sparkleSymbols = ["✦", "✧", "·"];

            for (let i = 0; i < 28; i++) {

                const sparkle =
                    document.createElement("div");

                sparkle.classList.add("sparkle");

                sparkle.textContent =
                    sparkleSymbols[
                        Math.floor(
                            Math.random() *
                            sparkleSymbols.length
                        )
                    ];

                sparkle.style.left =
                    `${Math.random() * 100}vw`;

                sparkle.style.fontSize =
                    `${7 + Math.random() * 9}px`;

                sparkle.style.animationDelay =
                    `${Math.random() * 6}s`;

                sparkle.style.animationDuration =
                    `${5 + Math.random() * 4}s`;

                document.body.appendChild(sparkle);
            }
        }

    </script>
</head>
<body>
    <div class="container">
        <div class="typing-animation">
            <h1>I can't wait!</h1>
        </div>
        <p class="final-message">See you on:</p>
        <span id="date-message"></span>
        <!-- Note: Cute music integration would require an audio file and tag, which is beyond current scope but conceptually implied by animations -->
    </div>
</body>
</html>
