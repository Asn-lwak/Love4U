<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excitement!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific styles for final page */

        body { 
            background-color: #f4f4f9; 
            color: #333; 
            font-family: 'Arial',
            Helvetica, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            margin: 0; 
            line-height: 1.6; 
        }
        .container {
            text-align: center;
            padding: 40px;
            border:1px solid #ccc;
            border-radius: 10px;
            background-color: #ffffff; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        h1 {
            color: #2c3e50; 
        }
        p {
            color: #7f8c8d; 
        }
        .final-message {
            margin-top: 20px;
            font-size: 1.5em;
            color: orange;
        }
        #date-message {
            font-size: 1.2em;
            margin-top: 10px;
            display: block;
        }

        /* Confetti and Hearts effects */
        .confetti {
            position: fixed;
            top: 0;
            width: 10px;
            height: 10px;
            background-color: #ff0;
            animation: confetti-fall 5s infinite;
            opacity: 0;
        }
        @keyframes confetti-fall {
            0% { top: -10%; opacity: 1; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; opacity: 0.5; transform: translateX(100px) rotate(720deg); }
        }

        .heart {
            position: fixed;
            bottom: -10%;
            font-size: 2em;
            color: #e91e63;
            animation: float-up 6s infinite;
            opacity: 0;
        }
        @keyframes float-up {
            0% { bottom: -10%; opacity: 0; transform: translateX(0); }
            50% { opacity: 1; }
            100% { bottom: 110%; opacity: 0; transform: translateX(50px); }
        }
    </style>
    <script>

        document.addEventListener("DOMContentLoaded", async () => {

            const params =
                new URLSearchParams(window.location.search);

            const responseId =
                params.get("id");

            const dateMessage =
                document.getElementById("date-message");

            if (!responseId) {

                dateMessage.textContent =
                    "Your date details couldn't be found. 💔";

                return;
            }

            try {

                const response = await fetch(
                    `/api/responses/${responseId}`
                );

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message);
                }

                const plan = result.response;

                const dateObj =
                    new Date(`${plan.date}T00:00:00`);

                const formattedDate =
                    dateObj.toLocaleDateString(
                        undefined,
                        {
                            weekday: "long",
                            year: "numeric",
                            month: "long",
                            day: "numeric"
                        }
                    );

                const [hours, minutes] =
                    plan.time.split(":");

                const timeObj =
                    new Date();

                timeObj.setHours(
                    Number(hours),
                    Number(minutes)
                );

                const formattedTime =
                    timeObj.toLocaleTimeString(
                        undefined,
                        {
                            hour: "numeric",
                            minute: "2-digit"
                        }
                    );

                dateMessage.innerHTML = `
                    <strong>${formattedDate}</strong><br>
                    ${formattedTime}<br>
                    <span>${plan.place}</span><br>
                    <small>${plan.location}</small>
                `;

            } catch (error) {

                console.error(
                    "Failed to load date plan:",
                    error
                );

                dateMessage.textContent =
                    "Something went wrong loading your date. 💔";
            }

            createConfetti();
            createHearts();

        });


        function createConfetti() {

            for (let i = 0; i < 50; i++) {

                const confetti =
                    document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left =
                    `${Math.random() * 100}vw`;

                confetti.style.animationDelay =
                    `${Math.random() * 5}s`;

                document.body.appendChild(confetti);
            }
        }


        function createHearts() {

            for (let i = 0; i < 20; i++) {

                const heart =
                    document.createElement("div");

                heart.classList.add("heart");

                heart.textContent = "♥";

                heart.style.left =
                    `${Math.random() * 100}vw`;

                heart.style.animationDelay =
                    `${Math.random() * 6}s`;

                document.body.appendChild(heart);
            }
        }

    </script>
</head>
<body>
    <div class="container">
        <div class="typing-animation">
            <h1>I can't wait!</h1>
        </div>
        <p class="final-message">See you on:</p>
        <span id="date-message"></span>
        <!-- Note: Cute music integration would require an audio file and tag, which is beyond current scope but conceptually implied by animations -->
    </div>
</body>
</html>
