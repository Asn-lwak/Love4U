<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QandA - Start</title>
    <style>
        body { 
            background-color: #f4f4f9; 
            color: #333; 
            font-family: 'Arial',
            Helvetica, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            margin: 0; 
            line-height: 1.6; 
        }
        .container {
            text-align: center;
            padding: 40px;
            border:1px solid #ccc;
            border-radius: 10px;
            background-color: #ffffff; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        .container.fade-in {
            opacity: 1;
        }

        h1 { 
            color: #2c3e50; 
        }

        .start-button {
            padding: 10px 20px;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }

        .start-button:hover { 
            background-color: #2980b9; 
        }
        
    </style>
</head>
<body>
    <div class="container" id="landing-container">
        <h1>Hey... LWAK wants to ask something about you.</h1>
        <p>It's only going to take about a minute.</p>
        <button class="start-button" onclick="window.location.href='questions.html'">Start</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('landing-container').classList.add('fade-in');
        });
    </script>
</body>
</html>
